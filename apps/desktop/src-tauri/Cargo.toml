[package]
name = "coi-desktop"
version = "0.1.0"
description = "A local coding companion"
authors = ["COI contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "coi_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
cap-std = "3"
ignore = "0.4"
regex = "1"
rfd = "0.15"
which = "7"
dirs = "6"
wait-timeout = "0.2"
libc = "0.2"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
toml = "0.8"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO"] }
